name: payments-streaming

# Kafka (KRaft, single node) + Spark (local mode) + Flink (profile: flink) + producer (profile: tools)
# + Postgres and Kafka Connect/Debezium (profile: cdc) + Prometheus/Grafana (profile: obs)
# If the Docker CLI is missing, the Makefile adds OrbStack's xbin folder to PATH.

services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "29092:29092" # access from the host (localhost:29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Creates the topics and exits (can also be run with make topics-init)
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        K=/opt/kafka/bin/kafka-topics.sh
        B=kafka:9092
        $$K --bootstrap-server $$B --create --if-not-exists --topic transactions      --partitions 3 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic wallet_cdc        --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic ledger_cdc        --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic fraud-alerts      --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --create --if-not-exists --topic fraud-alerts-flink --partitions 1 --replication-factor 1
        $$K --bootstrap-server $$B --list

  # Spark runs in local mode in a single container; jobs are spark-submitted with `make spark JOB=...`.
  spark:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    user: root
    working_dir: /jobs
    command: ["sleep", "infinity"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "4040:4040" # Spark UI (while a job is running)
    volumes:
      - ./spark/jobs:/jobs:ro
      - ./spark/data:/ref:ro
      - ./tests:/tests:ro # unit tests (make test)
      - ./producer:/producer:ro # tests import producer.py
      - ./data:/data
      - spark-ivy:/ivy # --packages cache (avoid downloading every time)

  jobmanager:
    profiles: ["flink"]
    build: ./flink
    image: payments-flink:1.20
    command: jobmanager
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081" # Flink UI
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ./flink/sql:/sql:ro

  taskmanager:
    profiles: ["flink"]
    image: payments-flink:1.20
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1536m
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

  producer:
    profiles: ["tools"]
    build: ./producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./data:/data

  # --- CDC source (profile cdc): Postgres (logical WAL) -> Debezium -> Kafka topic wallet_cdc
  postgres:
    profiles: ["cdc"]
    image: postgres:16
    hostname: postgres
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Kafka Connect with the Debezium Postgres connector; register it with `make cdc-up`
  connect:
    profiles: ["cdc"]
    image: quay.io/debezium/connect:2.7.3.Final
    hostname: connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083" # Connect REST API
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # --- Observability (profile obs): Prometheus scrapes Kafka (kafka-exporter), Spark drivers and Flink
  kafka-exporter:
    profiles: ["obs"]
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  spark-ivy:
