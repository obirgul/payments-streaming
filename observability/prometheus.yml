global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Spark drivers only exist while a job runs; each extra job takes the next UI port (4040, 4041, ...)
  - job_name: spark
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["spark:4040", "spark:4041", "spark:4042", "spark:4043"]
    # Spark names metrics after the app id (metrics_local_<ts>_driver_spark_streaming_<query>_<metric>_Value):
    # normalise to spark_streaming_<metric>{query="<query>"} so dashboards do not depend on the app id.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'metrics_local_[0-9]+_driver_spark_streaming_(.+)_(?:inputRate_total|processingRate_total|latency|states_rowsTotal|states_usedBytes|eventTime_watermark)_Value'
        target_label: query
        replacement: '$1'
      - source_labels: [__name__]
        regex: 'metrics_local_[0-9]+_driver_spark_streaming_.+_(inputRate_total|processingRate_total|latency|states_rowsTotal|states_usedBytes|eventTime_watermark)_Value'
        target_label: __name__
        replacement: 'spark_streaming_$1'
      - source_labels: [__name__]
        regex: 'metrics_local_.*'
        action: drop

  - job_name: flink
    static_configs:
      - targets: ["jobmanager:9249", "taskmanager:9249"]
